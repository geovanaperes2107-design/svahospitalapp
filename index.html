
<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SVA - Sistema de Vigilância de Antibióticos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class'
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        transition: background-color 0.3s ease, color 0.3s ease;
      }

      html.dark body {
        background-color: #0f172a !important;
        color: #f8fafc !important;
      }

      html:not(.dark) body {
        background-color: #f8fafc !important;
        color: #0f172a !important;
      }

      @keyframes bounce-slow {
        0%, 100% { transform: translateY(-2px); }
        50% { transform: translateY(2px); }
      }
      .animate-bounce-slow {
        animation: bounce-slow 3s infinite ease-in-out;
      }
      
      @media print {
        @page {
          size: landscape;
          margin: 1cm;
        }
        
        /* Ocultar tudo que não é conteúdo principal */
        .no-print, 
        aside, 
        header, 
        nav, 
        button, 
        input[type="month"], 
        select,
        .sidebar-container {
          display: none !important;
        }

        /* Mostrar apenas o que é essencial */
        .print-only {
          display: block !important;
        }

        body {
          background-color: white !important;
          padding: 0 !important;
          margin: 0 !important;
          color: black !important;
        }

        #root, main, .main-content {
          width: 100% !important;
          margin: 0 !important;
          padding: 0 !important;
          display: block !important;
          background: white !important;
        }

        /* Reset de bordas e sombras para o PDF ficar limpo */
        .rounded-[40px], .rounded-[32px], .rounded-2xl, .rounded-3xl {
          border-radius: 0 !important;
          border: 1px solid #eee !important;
        }
        
        .shadow-sm, .shadow-lg, .shadow-2xl, .shadow-xl {
          box-shadow: none !important;
        }

        /* Tabela profissional para impressão */
        table { 
          width: 100% !important;
          border-collapse: collapse !important;
          font-size: 10pt !important;
        }
        
        th {
          background-color: #f8fafc !important;
          color: black !important;
          border-bottom: 2px solid black !important;
          padding: 10px !important;
        }

        td {
          border-bottom: 1px solid #eee !important;
          padding: 10px !important;
        }

        tr {
          page-break-inside: avoid !important;
        }

        /* Forçar cores de badges no PDF */
        .bg-emerald-100 { background-color: #d1fae5 !important; }
        .bg-red-100 { background-color: #fee2e2 !important; }
        .bg-orange-100 { background-color: #ffedd5 !important; }
        
        * {
          -webkit-print-color-adjust: exact !important;
          print-color-adjust: exact !important;
        }
      }
    </style>
</head>
  <body>
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #0f172a; color: white; font-family: 'Inter', sans-serif;">
        <div style="width: 48px; height: 48px; border: 4px solid rgba(59, 130, 246, 0.2); border-top-color: #3b82f6; border-radius: 50%; animation: spin 1s linear infinite;"></div>
        <p style="margin-top: 16px; font-size: 12px; font-weight: 700; text-transform: uppercase; tracking: 0.1em; color: #94a3b8;">Carregando SVA Hospital...</p>
        <style>@keyframes spin { to { transform: rotate(360deg); } }</style>
      </div>
    </div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
